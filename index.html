<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

    body {
      background-color: black;
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      color: gold;
    }

    /* Header row */
    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    .logo-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .form-heading {
      color: gold;
      font-size: 28px;
      margin: 0;
      text-align: center;
      flex: 1;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: red;
      text-decoration: none;
      font-size: 18px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: orange;
    }

    /* Hero section */
    .hero {
      text-align: center;
      padding: 80px 20px;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .hero .status {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .hero-buttons button {
      background-color: gold;
      color: black;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .hero-buttons button:hover {
      background-color: orange;
      transform: scale(1.05);
    }

    /* Featured section */
    .featured {
      text-align: center;
      padding: 40px 20px;
    }

    .featured h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .featured-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .featured-card {
      background-color: #111;
      border: 2px solid gold;
      border-radius: 8px;
      width: 200px;
      padding: 15px;
      transition: all 0.3s ease;
    }

    .featured-card:hover {
      border-color: orange;
      transform: translateY(-5px);
      box-shadow: 0 0 15px rgba(255, 165, 0, 0.6);
    }

    .featured-card img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    /* Footer */
    footer {
      background-color: #111;
      color: gold;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

    footer a {
      color: red;
      margin: 0 10px;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: orange;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        text-align: center;
      }

      .nav-links {
        margin-top: 15px;
      }

      .featured-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="profile">
    <span id="profileName"></span>
    <img id="profileAvatar" style="display:none; width:40px; height:40px; border-radius:50%; margin-left:10px;">
    <script>
      window.onload=function(){
        let saved=JSON.parse(localStorage.getItem("user"));
        let loggedIn=localStorage.getItem("loggedIn");
        if(saved && loggedIn==="true"){
          document.getElementById("profileName").textContent = saved.user;
          if(saved.avatar){
            let img=document.getElementById("profileAvatar");
            img.src=saved.avatar;
            img.style.display="inline";
          }
        }
      }

      function logout(){
        localStorage.setItem("loggedIn","false");
        alert("Logged out!");
        window.location.href="Login.html";
      }
    </script>
  </div>

  <div class="header-container">
    <img class="logo-img" src="./my_logo.png" alt="Company Logo">
    <p class="form-heading">VanBurnerGames</p>
    <div class="nav-links">
      <a href="About.html">About</a>
      <a href="VanBurnerContactTab.html">Contact</a>
      <a href="VanburnerShop.html">Shop</a>
      <a href="Login.html">Login</a>
      <a href="SignUp.html">SignUp</a>
    </div>
  </div>

  <!-- Hero section -->
  <div class="hero">
    <h1>BLACK GUN</h1>
    <img src="./BG.png" alt="Black Gun">
    <p>First-Person Shooter</p>
    <p class="status">🟢 Coming Soon</p>
    <div class="hero-buttons"></div>
  </div>

  <!-- Featured Games -->
  <div class="featured">
    <h2>━━━━━━━━━━━━━━━━━━━━━━━<br>Featured Games<br>━━━━━━━━━━━━━━━━━━━━━━━</h2>
    <div class="featured-container">
      <div class="featured-card">
        <img src="./BG.png" alt="Black Gun">
        <p><b>Black Gun</b></p>
      </div>
      <div class="featured-card">
        <img src="./another.png" alt="Black Apocalypse">
        <p><b>Black Apocalypse</b></p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 VanBurnerGames. All rights reserved.</p>
    <p>
      <a href="https://twitter.com">Twitter</a> |
      <a href="https://facebook.com">Facebook</a> |
      <a href="https://instagram.com">Instagram</a>
    </p>
  </footer>
</body>
</html>
