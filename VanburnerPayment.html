<!DOCTYPE html>
<html>
<head>
  <title>VanBurnerGames Payment</title>
  <style>
    body {
      background:#000;
      color:#fff;
      font-family:Arial, sans-serif;
      text-align:center;
      padding:30px;
    }
    .header {
      background:#007BFF;
      color:#fff;
      padding:15px;
      font-size:28px;
      font-weight:bold;
      border-radius:8px;
    }
    .payment-box {
      background:#111;
      padding:20px;
      border-radius:10px;
      margin-top:30px;
      display:inline-block;
    }
    h2 {
      color:hotpink;
    }
    img {
      width:220px;
      margin-top:15px;
      border:3px solid gold;
      border-radius:10px;
    }
    .upi {
      margin-top:10px;
      font-size:18px;
      color:gold;
    }
    .birthday {
      margin-top:40px;
      font-size:24px;
      color:hotpink;
      font-weight:bold;
    }
  </style>
</head>
<body>
  <div class="header">VanBurnerGames Payment</div>

  <div class="payment-box">
    <h2>Pay with GPay</h2>
    <p>Scan this QR to pay:</p>
    <!-- Replace with your actual UPI QR image -->
    <img src="your-upi-qr.png" alt="GPay QR Code">
    <p class="upi">Or send to UPI ID: <b>yourname@upi</b></p>
  </div>

  <div class="birthday">🎂 Happy Birthday Mum 🎂</div>
</body>
</html>
