<!DOCTYPE html>
<html>
<head>
<div class="profile">
  <span id="profileName"></span>
  <img id="profileAvatar" style="display:none; width:40px; height:40px; border-radius:50%; margin-left:10px;">
  <button onclick="logout()" style="margin-left:15px; background:red; color:white; border:none; padding:5px 10px; border-radius:6px; cursor:pointer;">Logout</button>
</div>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

    body {
      background-color: black;
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      color: gold;
    }

    /* Header */
    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    .logo-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .form-heading {
      font-size: 28px;
      margin: 0;
      text-align: center;
      flex: 1;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: red;
      text-decoration: none;
      font-size: 18px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover { color: orange; }
    .nav-links a:active { color: yellow; }

    /* Contact section */
    .contact {
      text-align: center;
      padding: 40px 20px;
    }

    .contact h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .contact-info {
      font-size: 16px;
      margin: 10px 0;
    }

    .contact-info a {
      color: red;
      text-decoration: none;
    }

    .contact-info a:hover { color: orange; }

    /* Team section */
    .team {
      text-align: center;
      padding: 40px 20px;
    }

    .team h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .team-member {
      background-color: #111;
      border: 2px solid gold;
      border-radius: 8px;
      width: 250px;
      margin: 0 auto;
      padding: 15px;
      transition: all 0.3s ease;
    }

    .team-member:hover {
      border-color: orange;
      transform: translateY(-5px);
      box-shadow: 0 0 15px rgba(255,165,0,0.6);
    }

    .team-member img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    /* Footer */
    footer {
      background-color: #111;
      color: gold;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

    footer a {
      color: red;
      margin: 0 10px;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:hover { color: orange; }
  </style>
</head>
<body>
