<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');
    body {
      background:black;
      font-family:'Orbitron',sans-serif;
      color:gold;
      margin:0;
    }

    .login-container {
      display:flex;
      justify-content:center;
      align-items:center;
      height:80vh;
    }

    .login-box {
      background:#111;
      border:2px solid gold;
      border-radius:10px;
      padding:30px;
      width:300px;
      text-align:center;
      box-shadow:0 0 15px rgba(255,165,0,0.6);
    }

    .login-box h2 {
      margin-bottom:20px;
    }

    .login-box input {
      width:100%;
      padding:10px;
      margin:10px 0;
      border:none;
      border-radius:8px;
      font-size:14px;
    }

    .login-box button {
      background:gold;
      color:black;
      border:none;
      padding:12px 25px;
      font-size:16px;
      cursor:pointer;
      border-radius:10px;
      transition:all 0.3s ease;
      margin-top:10px;
    }

    .login-box button:hover {
      background:orange;
      transform:scale(1.05);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h2>Login</h2>
      <form onsubmit="login(event)">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p style="margin-top:15px; font-size:14px; color:#ccc;">
        Don’t have an account? <a href="Signup.html" style="color:red;">Sign Up</a>
      </p>
    </div>
  </div>

<script>
function login(e){
  e.preventDefault();
  let user=document.getElementById("username").value;
  let pass=document.getElementById("password").value;
  let saved=JSON.parse(localStorage.getItem("user"));

  if(saved && saved.user===user && saved.pass===pass){
    alert("Login successful! Welcome "+user);
    window.location.href="Home.html"; // redirect after login
  } else {
    alert("Invalid credentials. Try again.");
  }
}
if(saved && saved.user===user && saved.pass===pass){
  alert("Login successful! Welcome "+user);
  localStorage.setItem("loggedIn", "true");
  window.location.href="Home.html"; 
}
</script>
</body>
</html>
